name: Genre Point Forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"  

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: py/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r py/requirements.txt

      - name: Run genre forecast
        run: python py/forecast.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
